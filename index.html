<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Reportes CENSIA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header-oficial">
        <div class="pleca-guinda"></div>
        <div class="texto-logos">
            <div class="st">SECRETARÍA DE SALUD</div>
            <div class="censia">Centro Nacional para la Salud de la Infancia y la Adolescencia</div>
        </div>
    </header>

    <!-- MÓDULO DE AUTENTICACIÓN (Requerimiento 4) -->
    <div id="seccion-login" class="auth-container">
        <h2>Acceso Restringido</h2>
        <p style="font-size: 0.9em; color: #666; margin-bottom: 20px;">Identifícate para generar reportes</p>
        <input type="text" id="login-usuario" placeholder="Usuario">
        <input type="password" id="login-password" placeholder="Contraseña">
        <select id="login-institucion">
            <option value="">-- Selecciona Institución --</option>
            <option value="SSA">Secretaría de Salud (SSA)</option>
            <option value="IMSS">IMSS / IMSS Bienestar</option>
            <option value="ISSSTE">ISSSTE</option>
            <option value="OTRA">Otra Institución</option>
        </select>
        <button class="btn-principal" onclick="validarAcceso()">Ingresar al Sistema</button>
    </div>

    <!-- DASHBOARD DE FILTROS (Requerimientos 1 y 3) -->
    <div id="seccion-dashboard" class="oculto" style="padding: 20px;">
        <div class="filtros-panel">
            <div class="filtro-grupo">
                <label>Tipo de Reporte</label>
                <select id="filtro-tipo">
                    <option value="censo">Censo Vacunal (Anexos 1A, 1B, 1C)</option>
                    <option value="informe">Informe Final de Actividad (Resumen)</option>
                    <option value="bloqueo">Acciones en Bloqueo Vacunal</option>
                </select>
            </div>
            <div class="filtro-grupo">
                <label>Institución</label>
                <input type="text" id="filtro-institucion" readonly style="background: #e9ecef; font-weight: bold; color: #555;">
            </div>
            <div class="filtro-grupo">
                <label>Vacunador</label>
                <select id="filtro-vacunador"><option value="">-- Todos --</option></select>
            </div>
            <div class="filtro-grupo">
                <label>Registrador</label>
                <select id="filtro-registrador"><option value="">-- Todos --</option></select>
            </div>
            <div class="filtro-grupo" id="contenedor-filtro-caso" style="display: none;">
                <label for="filtro-caso">Seleccionar Caso (Bloqueo Terminado)</label>
                <select id="filtro-caso">
                    <option value="">-- Seleccione un Caso --</option>
                </select>
            </div>
                        <div class="filtro-grupo">
                <label>Fecha Inicial / Única</label>
                <input type="date" id="filtro-fecha-inicio">
            </div>
            <div class="filtro-grupo">
                <label>Fecha Final (Opcional para Rangos)</label>
                <input type="date" id="filtro-fecha-fin">
            </div>
            <div class="panel-acciones">
                <button class="btn-principal" onclick="ejecutarGeneracionPorFiltros()">Generar Reporte Seleccionado</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <script src="script.js"></script>

</body>
</html>
